name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEXYNC_EMBEDDING_PROVIDER: deterministic
      LEXYNC_LANGUAGE_DETECTION_PROVIDER: script
      LEXYNC_GENERATION_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm backend:start
      - run: pnpm backend:reset
      - run: pnpm test:db
      - run: pnpm check
      - run: node scripts/with-local-supabase.mjs pnpm build
      - run: node scripts/with-local-supabase.mjs pnpm exec playwright test
      - name: Build production extension artifact
        env:
          WXT_PUBLIC_SUPABASE_URL: ${{ vars.EXTENSION_SUPABASE_URL }}
          WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXTENSION_SUPABASE_PUBLISHABLE_KEY }}
          WXT_PUBLIC_WEB_URL: ${{ vars.EXTENSION_WEB_URL }}
        run: |
          test -n "$WXT_PUBLIC_SUPABASE_URL"
          test -n "$WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$WXT_PUBLIC_WEB_URL"
          pnpm --filter @lexync/extension build
          pnpm extension:package
      - name: Generate extension release metadata
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/generate-extension-release-metadata.mjs --artifact artifacts/lexync-chromium.zip --output artifacts/release-metadata.json
      - if: failure()
        run: node scripts/capture-supabase-diagnostics.mjs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results
            artifacts/supabase
          if-no-files-found: ignore
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lexync-chromium-extension
          path: |
            artifacts/lexync-chromium.zip
            artifacts/release-metadata.json
          if-no-files-found: error
      - if: always()
        run: pnpm backend:stop

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:start
      - run: pnpm backend:reset
      - run: pnpm android:test
      - run: pnpm android:build
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: pnpm android:acceptance
      - if: failure()
        run: node scripts/capture-supabase-diagnostics.mjs
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-diagnostics
          path: |
            artifacts/android
            artifacts/supabase
            apps/android/app/build/outputs/androidTest-results
            apps/android/app/build/reports/androidTests
            apps/android/app/build/reports/tests
          if-no-files-found: ignore
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lexync-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: always()
        run: pnpm backend:stop

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Check linked project configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Link the deployed project
        run: pnpm dlx supabase@2.115.0 link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Confirm the linked project matches the repository
        run: pnpm db:verify

  aggregate:
    name: Aggregate
    if: ${{ !cancelled() }}
    needs:
      - javascript
      - android
      - migration-drift
    runs-on: ubuntu-24.04
    steps:
      - env:
          ANDROID_RESULT: ${{ needs.android.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          MIGRATION_DRIFT_RESULT: ${{ needs['migration-drift'].result }}
        run: test "$ANDROID_RESULT" = success && test "$JAVASCRIPT_RESULT" = success && test "$MIGRATION_DRIFT_RESULT" = success
