name: Push database migrations

on:
  workflow_dispatch:
    inputs:
      push_confirmation:
        description: Confirm that pending migrations should be applied to the linked project
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: database-migrations
  cancel-in-progress: false

permissions: {}

jobs:
  push:
    name: Push pending migrations to the linked project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: supabase-migrations
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.30.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Check release configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link the deployed project
        run: pnpm dlx supabase@2.115.0 link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Report the pending migrations
        run: pnpm dlx supabase@2.115.0 db push --linked --skip-vault --dry-run

      - name: Push pending migrations
        if: inputs.push_confirmation == 'yes'
        run: pnpm db:push

      - name: Confirm the linked project matches the repository
        if: inputs.push_confirmation == 'yes' && success()
        run: pnpm db:verify
